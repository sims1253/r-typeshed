name: Prepare typeshed updates

on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:
    inputs:
      package:
        description: "R package to prepare (leave empty to check tracked upstream versions)"
        required: false
        type: string

concurrency:
  group: typeshed-updates
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      - name: Install JSON support
        run: Rscript -e 'install.packages("jsonlite")'
      - name: Select packages
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Rscript --vanilla scripts/update_typeshed.R plan "$PACKAGE" > candidates.json
          gh pr list --state open --limit 1000 --json headRefName,url > open-prs.json
          jq -c --slurpfile prs open-prs.json 'map(.package as $p | select(any($prs[0][]; .headRefName | startswith("automation/typeshed-\($p)-")) | not))' candidates.json > packages.json
          echo "packages=$(cat packages.json)" >> "$GITHUB_OUTPUT"
          echo "Packages selected: $(cat packages.json). Existing drafts are kept for human edits." >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
      PACKAGE_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          extra-repositories: ${{ matrix.package == 'cmdstanr' && 'https://stan-dev.r-universe.dev' || '' }}
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          packages: |
            any::jsonlite
            ${{ matrix.package != 'base' && format('any::{0}@{1}', matrix.package, matrix.version) || '' }}
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          upgrade: 'TRUE'
      - name: Generate draft and review notes
        run: Rscript --vanilla scripts/update_typeshed.R prepare "$PACKAGE" "$PACKAGE_VERSION" "$RUNNER_TEMP/review.md"
      - name: Read consumer revision
        id: consumer
        run: echo "ref=$(cat .github/ry-consumer)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sims1253/ry
          ref: ${{ steps.consumer.outputs.ref }}
          path: ry-consumer
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ry-consumer -> target
      - name: Validate and audit the draft
        run: |
          cargo build --manifest-path ry-consumer/Cargo.toml -p ry-cli --release
          set +e
          for check in schema names semantics; do
            case "$check" in
              schema) ry-consumer/target/release/ry typeshed validate stubs > "$RUNNER_TEMP/$check.log" 2>&1 ;;
              names) Rscript --vanilla scripts/audit_typeshed.R > "$RUNNER_TEMP/$check.log" 2>&1 ;;
              semantics) Rscript --vanilla scripts/audit_function_semantics.R > "$RUNNER_TEMP/$check.log" 2>&1 ;;
            esac
            status=$?
            {
              echo ""
              echo "### $check (exit $status)"
              echo '```text'
              tail -60 "$RUNNER_TEMP/$check.log"
              echo '```'
            } >> "$RUNNER_TEMP/review.md"
          done
      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- "stubs/$PACKAGE" upstream-versions.json
          if git diff --cached --quiet; then
            cat "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/typeshed-${PACKAGE}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Prepare typeshed for $PACKAGE"
          gh auth setup-git
          git push origin "$branch"
          url=$(gh pr create --draft --head "$branch" --title "Prepare typeshed for $PACKAGE" --body-file "$RUNNER_TEMP/review.md")
          echo "Draft ready: $url" >> "$GITHUB_STEP_SUMMARY"

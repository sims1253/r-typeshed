name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read consumer revision
        id: consumer
        run: echo "ref=$(cat .github/ry-consumer)" >> "$GITHUB_OUTPUT"
      - name: Check out ry source
        uses: actions/checkout@v4
        with:
          repository: sims1253/ry
          ref: ${{ steps.consumer.outputs.ref }}
          path: ry
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ry -> target
      - name: Build ry
        run: cargo build --manifest-path ry/Cargo.toml -p ry-cli --release
      - name: Validate stubs
        run: ry/target/release/ry typeshed validate stubs/

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read consumer revision
        id: consumer
        run: echo "ref=$(cat .github/ry-consumer)" >> "$GITHUB_OUTPUT"
      - name: Check out ry source
        uses: actions/checkout@v4
        with:
          repository: sims1253/ry
          ref: ${{ steps.consumer.outputs.ref }}
          path: ry
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ry -> target
      - name: Build ry
        run: cargo build --manifest-path ry/Cargo.toml -p ry-cli --release
      - name: Check candidate stubs through ry inference
        run: scripts/inference_gate.sh ry/target/release/ry stubs/
      - name: Prove the gate bites (mutation self-test)
        run: scripts/inference_mutation_test.sh ry/target/release/ry

  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          # Reference R release, tied to the base/grid entries in
          # upstream-versions.json; bump both together.
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Render pinned package list
        id: pins
        run: |
          Rscript --vanilla scripts/render_ci_packages.R pinned | tee pins.txt
          {
            echo 'packages<<EOF'
            cat pins.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Install R packages (generator JSON I/O + audited namespaces)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Exact reference versions rendered from upstream-versions.json
          # at job runtime; no version literal lives in this file.
          packages: ${{ steps.pins.outputs.packages }}

      - name: Install archived inventory test packages
        run: Rscript --vanilla tests/install_set6_deps.R
      - name: Verify set6 and dictionar6 exports
        run: Rscript --vanilla tests/set6.R
      - name: Verify magrittr inventory
        run: Rscript --vanilla tests/magrittr.R
      - name: Verify glue inventory
        run: Rscript --vanilla tests/glue.R
      - name: Verify stringr inventory
        run: Rscript --vanilla tests/stringr.R
      - name: Verify tibble inventory
        run: Rscript --vanilla tests/tibble.R
      - name: Verify lifecycle inventory
        run: Rscript --vanilla tests/lifecycle.R
      - name: Verify jsonlite inventory
        run: Rscript --vanilla tests/jsonlite.R
      - name: Verify httr inventory
        run: Rscript --vanilla tests/httr.R
      - name: Verify checkmate inventory
        run: Rscript --vanilla tests/checkmate.R
      - name: Verify readr inventory
        run: Rscript --vanilla tests/readr.R
      - name: Verify scales inventory
        run: Rscript --vanilla tests/scales.R
      - name: Verify RColorBrewer inventory
        run: Rscript --vanilla tests/RColorBrewer.R
      - name: Verify xml2 inventory
        run: Rscript --vanilla tests/xml2.R
      - name: Verify MASS inventory
        run: Rscript --vanilla tests/MASS.R
      - name: Verify zoo inventory
        run: Rscript --vanilla tests/zoo.R
      - name: Verify Matrix inventory
        run: Rscript --vanilla tests/Matrix.R
      - name: Verify gridExtra inventory
        run: Rscript --vanilla tests/gridExtra.R

      - name: Test audit failure detection
        run: Rscript --vanilla tests/audits.R
      - name: Verify file.path and seq_len length semantics
        run: Rscript --vanilla tests/base_lengths.R
      - name: Verify ifelse test-template mode semantics
        run: Rscript --vanilla tests/ifelse_mode.R
      - name: Verify append insertion-position semantics
        run: Rscript --vanilla tests/append.R
      - name: Verify as.vector coercion return contract
        run: Rscript --vanilla tests/as_vector.R
      - name: Verify AIC/BIC single-model, multi-model, and BIC-NA controls
        run: Rscript --vanilla tests/aic_bic.R
      - name: Verify density length and missingness semantics
        run: Rscript --vanilla tests/density_lengths.R
      - name: Verify complex-capable math return modes
        run: Rscript --vanilla tests/complex_math.R
      - name: Verify dynamic-dots constructor contracts
        run: Rscript --vanilla tests/dynamic_dots.R
      - name: Verify grid inventory and captured expressions
        run: Rscript --vanilla tests/grid.R
      - name: Verify regmatches container and element shapes
        run: Rscript --vanilla tests/regmatches.R
      - name: Verify sort.int atomic and indexed returns
        run: Rscript --vanilla tests/sort_int.R
      - name: Verify ggplot2 drawing exports
        run: Rscript --vanilla tests/ggplot2.R
      - name: Verify recursive apply result shapes
        run: Rscript --vanilla tests/rapply.R

      - name: Verify grep result controls
        run: Rscript --vanilla tests/grep.R
      - name: Verify fold result controls
        run: Rscript --vanilla tests/folds.R
      - name: Verify confidence interval dispatch controls
        run: Rscript --vanilla tests/confint.R
      - name: Verify expand.grid columns and dispatch controls
        run: Rscript --vanilla tests/expand_grid.R
      - name: Verify exported HTML tag lists
        run: Rscript --vanilla tests/html_tags.R
      - name: Verify model.extract symbol capture and coercion controls
        run: Rscript --vanilla tests/model_extract.R
      - name: Verify Filter and Position result controls
        run: Rscript --vanilla tests/filter_position.R
      - name: Verify Find result and evaluation controls
        run: Rscript --vanilla tests/find.R
      - name: Verify mirai status contract
        run: Rscript --vanilla tests/mirai.R
      - name: Test pinned-version source agreement
        run: Rscript --vanilla tests/pinned_versions.R
      - name: Test generators
        run: Rscript --vanilla tests/generators.R
      - name: Test package-update planning and curation preservation
        run: Rscript --vanilla tests/updates.R
      - name: Standard globals are current
        run: Rscript scripts/gen_standard_globals.R --check
      - name: Audit allowlisted zero-argument primitives
        run: Rscript --vanilla scripts/audit_zero_arg_primitives.R
      - name: Audit stubs against installed namespaces
        # Skips stubs whose package is not installed; the install list
        # above defines the coverage we always get in CI.
        run: Rscript scripts/audit_typeshed.R
      - name: Audit function-semantics provenance
        run: Rscript --vanilla scripts/audit_function_semantics.R

  drift:
    # Informational upstream-drift signal: installs latest CRAN releases and
    # re-runs the oracle comparisons as non-failing probes. Never required;
    # a new upstream release must not break unrelated PRs. RT_TYPESHED_DRIFT
    # skips the oracles' recorded-version gates so a harmless version bump
    # cannot fail a probe before its behavioral export/formal checks run —
    # version movement belongs to the report table, not the probe verdicts.
    # Monthly update drafting stays in .github/workflows/update-typeshed.yml
    # — this job is the per-PR early-warning view, not a second planner.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RT_TYPESHED_DRIFT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Render drift package list
        id: drift
        run: |
          Rscript --vanilla scripts/render_ci_packages.R drift | tee drift.txt
          {
            echo 'packages<<EOF'
            cat drift.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Install latest upstream packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ${{ steps.drift.outputs.packages }}
      - name: Install archived inventory test packages
        run: Rscript --vanilla tests/install_set6_deps.R
      - name: Record installed versions
        run: Rscript --vanilla scripts/report_drift.R > drift-report.md
      - name: Probe inventory oracles against latest upstream
        run: |
          set +e
          : > drift-probes.log
          for probe in tests/set6.R tests/magrittr.R tests/glue.R tests/stringr.R tests/tibble.R tests/lifecycle.R tests/jsonlite.R tests/httr.R tests/checkmate.R tests/readr.R tests/scales.R tests/RColorBrewer.R tests/xml2.R tests/MASS.R tests/zoo.R tests/Matrix.R tests/gridExtra.R tests/mirai.R tests/ggplot2.R tests/html_tags.R; do
            if Rscript --vanilla "$probe" >> drift-probes.log 2>&1; then
              echo "- PASS ${probe}" >> drift-report.md
            else
              echo "- FAIL ${probe} (drift signal, non-blocking)" >> drift-report.md
            fi
          done
          cat drift-report.md >> "$GITHUB_STEP_SUMMARY"
          cat drift-probes.log

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# This immutable commit is the schema-2 consumer. It is intentionally pinned
# rather than using a branch so CI always validates against a reviewable loader.
# Bootstrap: it is currently local on ry's dev/typeshed-semantics-release-prep
# branch and must be pushed before this checkout (and therefore this job) can
# resolve. Push that ry commit first; no release is required.
env:
  RY_SCHEMA_2_CONSUMER_COMMIT: 1d80824c87362d38e2e78d6fb17126581cc8218b

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: Switch to the linux x86_64 release binary after a ry release
      # containing `typeshed validate` is published.
      - name: Check out ry source
        uses: actions/checkout@v4
        with:
          repository: sims1253/ry
          # Schema-2 consumer pinned above. Do not replace this with a branch:
          # the local bootstrap commit must be pushed before this job can run.
          ref: ${{ env.RY_SCHEMA_2_CONSUMER_COMMIT }}
          path: ry
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ry -> target
      - name: Build ry
        run: cargo build --manifest-path ry/Cargo.toml -p ry-cli --release
      - name: Validate stubs
        run: ry/target/release/ry typeshed validate stubs/

  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages (generator JSON I/O + audited namespaces)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::rlang
            any::purrr
            any::dplyr
            any::mirai
            any::carrier
      - name: Validate r-typeshed schema contracts
        run: Rscript --vanilla scripts/validate_schema.R --self-test
      - name: Standard globals are current
        run: Rscript scripts/gen_standard_globals.R --check
      - name: Audit stubs against installed namespaces
        # Skips stubs whose package is not installed; the install list
        # above pins the coverage we always get in CI.
        run: Rscript scripts/audit_typeshed.R
      - name: Audit function-semantics provenance
        run: Rscript --vanilla scripts/audit_function_semantics.R

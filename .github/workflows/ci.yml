name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Immutable ry consumer with schema-2 support.
env:
  RY_SCHEMA_2_CONSUMER_COMMIT: 931b0b6ada35f61547db12d6d9a2f945f5f6881c

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: Switch to the linux x86_64 release binary after a ry release
      # containing `typeshed validate` is published.
      - name: Check out ry source
        uses: actions/checkout@v4
        with:
          repository: sims1253/ry
          ref: ${{ env.RY_SCHEMA_2_CONSUMER_COMMIT }}
          path: ry
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ry -> target
      - name: Build ry
        run: cargo build --manifest-path ry/Cargo.toml -p ry-cli --release
      - name: Validate stubs
        run: ry/target/release/ry typeshed validate stubs/

  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages (generator JSON I/O + audited namespaces)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::rlang
            any::vctrs
            any::purrr
            any::dplyr
            any::mirai
            any::carrier
      - name: Test generators
        run: Rscript --vanilla tests/generators.R
      - name: Standard globals are current
        run: Rscript scripts/gen_standard_globals.R --check
      - name: Audit allowlisted zero-argument primitives
        run: Rscript --vanilla scripts/audit_zero_arg_primitives.R
      - name: Audit stubs against installed namespaces
        # Skips stubs whose package is not installed; the install list
        # above defines the coverage we always get in CI.
        run: Rscript scripts/audit_typeshed.R
      - name: Audit function-semantics provenance
        run: Rscript --vanilla scripts/audit_function_semantics.R
